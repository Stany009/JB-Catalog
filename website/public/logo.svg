<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="#f8f9fa"/>
  
  <!-- Wave decoration at bottom -->
  <g clip-path="url(#circle-clip)">
    <path d="M0,320 Q80,280 160,310 Q240,340 320,300 Q360,285 400,305 L400,400 L0,400 Z" fill="#e8f4f8" opacity="0.6"/>
    <path d="M0,340 Q100,310 200,335 Q300,360 400,325 L400,400 L0,400 Z" fill="#d4eef5" opacity="0.5"/>
  </g>
  
  <!-- JB POOLS text -->
  <text x="200" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="#0B2342" letter-spacing="-1">JB POOLS</text>
  
  <!-- Aqua waterline in OO -->
  <g opacity="0.95">
    <path d="M148,155 Q155,145 165,150 Q175,155 185,148" stroke="#35C6D9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M215,155 Q225,145 235,150 Q245,155 252,148" stroke="#35C6D9" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Horizontal line left -->
  <line x1="70" y1="200" x2="130" y2="200" stroke="#35C6D9" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- & ACCESSORIES text -->
  <text x="200" y="205" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#0B2342" letter-spacing="8">&amp; ACCESSORIES</text>
  
  <!-- Horizontal line right -->
  <line x1="270" y1="200" x2="330" y2="200" stroke="#35C6D9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
